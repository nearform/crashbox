<html lang="en">

    <link

      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="https://nearform.com/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

    <style>
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
        color: #1a1a1a;
        background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        text-align: center;
        /* Balance wrapped lines so centered text forms an even block, not a long
           line over a short orphan. Applies to every centered element below. */
        text-wrap: balance;
        margin-bottom: 40px;
        padding: 40px 20px;
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .header h1 {
        margin: 0;
        color: #2d3748;
        font-size: 2.75em;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .header p {
        margin: 16px 0 0 0;
        color: #4a5568;
        font-size: 1.2em;
        font-weight: 400;
      }
      .demo-section {
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin-bottom: 24px;
        padding: 32px;
      }
      .demo-section h2 {
        color: #2d3748;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 1.5em;
        letter-spacing: -0.01em;
      }
      /* Keep long breadcrumb/stack output inside the card on mobile instead of overflowing. */
      .demo-section pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f4f4f5;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.8em;
        max-width: 100%;
      }
      /* Action triggers: full-width, thumb-friendly stack on mobile; content-width
         buttons that wrap into rows on wider viewports so desktop isn't a tall,
         half-empty column. */
      .trigger-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .trigger {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        white-space: normal;
      }
      @media (min-width: 48em) {
        .trigger-group {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: stretch;
        }
        .trigger {
          width: auto;
          max-width: 420px;
        }
      }
      /* Title + GitHub icon on one centered row. */
      .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      /* GitHub icon link in the header — circular badge that tints on hover. */
      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: #edf2f7;
        border-radius: 50%;
        font-size: 1.4em;
        color: #4a5568;
        text-decoration: none;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .github-link:hover {
        background: #2d3748;
        color: #ffffff;
      }
      /* Code area with a copy button tucked into its top-right corner. */
      .code-block {
        position: relative;
      }
      .copy-button {
        position: absolute;
        top: 8px;
        right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid #d4d4d8;
        background: #ffffff;
        border-radius: 6px;
        font-size: 1.1em;
        color: #4a5568;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .copy-button:hover {
        background: #edf2f7;
        color: #2d3748;
      }
    </style>
    <title>crashbox Demo</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "htm": "https://esm.sh/htm@3.1.1?dev&external=react,react-dom",
          "react": "https://esm.sh/react@19.1.0?dev&external=react,react-dom",
          "react/jsx-runtime": "https://esm.sh/react@19.1.0/jsx-runtime?dev&external=react,react-dom",
          "react-dom": "https://esm.sh/react-dom@19.1.0?dev&external=react,react-dom",
          "react-dom/client": "https://esm.sh/react-dom@19.1.0/client?dev&external=react,react-dom"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import htm from "htm";
      import * as crashbox from "./src/index.js";

      const html = htm.bind(React.createElement);
      const { useState, useEffect, useCallback } = React;

      // Initialize BEFORE render so recover-on-load fires and any crash from the *previous*
      // load is captured synchronously, ready to show at the top of the page.
      let recoveredRecord = null;
      crashbox.init({
        detectors: ["webgpu", "wasm", "js", "memory"],
        debug: true, // attaches window.__crashbox (.dump/.clear/.recovered) for laptop Safari
        onCrashRecovered(record) {
          recoveredRecord = record;
        },
        onMemoryPressure() {
          crashbox.breadcrumb("onMemoryPressure fired");
        },
        onDeviceLossImminent(info) {
          crashbox.breadcrumb("onDeviceLossImminent", info);
        },
      });

      // window.__crashbox is attached by the SDK itself (init's debug:true above).

      // One-shot capability probe (sync booleans are valid even over plain HTTP — research §6).
      const supports = (fn, fallback = false) => {
        try {
          return fn();
        } catch {
          return fallback;
        }
      };
      const CAPABILITIES = {
        webgpu: supports(() => !!navigator.gpu),
        wasm: typeof WebAssembly !== "undefined",
        "longtask observer": supports(() =>
          PerformanceObserver.supportedEntryTypes.includes("longtask"),
        ),
        "performance.memory": supports(() => !!performance.memory),
        wasDiscarded: supports(() => "wasDiscarded" in document),
      };

      const readMemoryMB = () =>
        supports(
          () =>
            performance.memory
              ? Math.round(performance.memory.usedJSHeapSize / 1048576)
              : null,
          null,
        );

      const Badge = ({ kind }) => {
        const map = {
          kill: ["hard kill (iOS) · catchable (desktop)", "#c0392b"],
          catchable: ["catchable (tab survives)", "#2980b9"],
          manual: ["manual / best-effort", "#8e44ad"],
        };
        const [label, color] = map[kind] || ["", "#777"];
        return html`<span
          style=${{
            background: color,
            color: "#fff",
            borderRadius: "4px",
            padding: "2px 8px",
            fontSize: "0.7em",
            whiteSpace: "nowrap",
          }}
          >${label}</span
        >`;
      };

      // Layout lives in the .trigger / .trigger-group CSS (media query) so desktop can
      // switch from a full-width mobile stack to content-width buttons that wrap into rows.
      const Trigger = ({ label, kind, onClick }) => html`
        <button className="pure-button trigger" onClick=${onClick}>
          <span>${label}</span><${Badge} kind=${kind} />
        </button>
      `;

      // Copy `text` to the clipboard with a brief check-mark affordance. Falls back to a
      // hidden textarea + execCommand for non-secure contexts / older Safari without the API.
      const CopyButton = ({ text }) => {
        const [copied, setCopied] = useState(false);
        const copy = useCallback(async () => {
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
            } catch {
              /* clipboard unavailable — nothing else to do */
            }
            ta.remove();
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        }, [text]);
        return html`<button
          type="button"
          className="copy-button"
          onClick=${copy}
          aria-label="Copy to clipboard"
          title=${copied ? "Copied!" : "Copy"}
        >
          <i className=${"ph " + (copied ? "ph-check" : "ph-copy")}></i>
        </button>`;
      };

      // Inline JSON dump for the debug pane. `payload` null/empty renders an italic "nothing" line;
      // otherwise the code area carries a copy button overlaid in its top-right corner.
      const isEmpty = (v) =>
        v == null || (typeof v === "object" && Object.keys(v).length === 0);
      const InlineView = ({ view }) => {
        if (isEmpty(view.payload)) {
          return html`<p style=${{ color: "#777", fontStyle: "italic" }}>
            No data for "${view.label}" — nothing to show.
          </p>`;
        }
        const text = JSON.stringify(view.payload, null, 2);
        return html`<div className="code-block">
          <${CopyButton} text=${text} />
          <pre>${text}</pre>
        </div>`;
      };

      const App = () => {
        const [counter, setCounter] = useState(0);
        const [status, setStatus] = useState(crashbox.getStatus());
        const [memMB, setMemMB] = useState(readMemoryMB());
        const [pressed, setPressed] = useState([]);
        // null = nothing shown; { label, payload } once a debug button is clicked.
        const [inlineView, setInlineView] = useState(null);

        // Continuously snapshot a counter+timestamp so every crash leaves a verifiable trail.
        useEffect(() => {
          const id = setInterval(() => {
            setCounter((c) => {
              const next = c + 1;
              crashbox.setSnapshot({ counter: next, ts: Date.now() });
              return next;
            });
            setStatus(crashbox.getStatus());
            setMemMB(readMemoryMB());
          }, 1000);
          return () => clearInterval(id);
        }, []);

        // Breadcrumb on every action + mirror it in the on-page log.
        const note = useCallback((msg, data) => {
          crashbox.breadcrumb(msg, data);
          setPressed((p) => [...p.slice(-19), msg]);
        }, []);

        // --- triggers ---------------------------------------------------------
        const cleanReload = () => {
          note("clean reload (negative control)");
          location.reload(); // fires pagehide{persisted:false} → clean-shutdown marker
        };
        const uncaughtException = () => {
          note("trigger: uncaught exception");
          setTimeout(() => {
            throw new Error("crashbox demo: uncaught exception");
          }, 0);
        };
        const unhandledRejection = () => {
          note("trigger: unhandled rejection");
          Promise.reject(new Error("crashbox demo: unhandled rejection"));
        };
        const longTask = () => {
          note("trigger: long task (3s main-thread block)");
          const end = Date.now() + 3000;
          while (Date.now() < end) {
            /* block */
          }
        };
        const wasmBlowup = () => {
          note("trigger: WASM linear-memory blowup");
          // Mirrors research spike 03: maximum + touching each grown page forces a PHYSICAL
          // commit (raw grow() is lazy), which actually hard-kills the tab on iOS. The wasm
          // detector wraps Memory.prototype.grow and breadcrumbs memory-near-cap milestones
          // itself, so the kill (which leaves no RangeError) still infers "oom" — no manual
          // crumbs here.
          const mem = new WebAssembly.Memory({ initial: 1, maximum: 65536 });
          const STEP = 256; // 256 * 64 KB = 16 MB per step
          const grow = () => {
            try {
              const before = mem.buffer.byteLength;
              mem.grow(STEP);
              const view = new Uint8Array(mem.buffer);
              for (let i = before; i < view.length; i += 4096) view[i] = 1;
              setTimeout(grow, 0);
            } catch (e) {
              note(`WASM grow threw (caught, tab survived): ${e.message}`);
            }
          };
          grow();
        };
        const reportPressure = () => {
          // App-declared pressure (the reportMemoryPressure escape hatch): flows into the same
          // warnings buffer + memory-near-cap breadcrumb as auto-detected pressure, so it shows
          // live below and would recover as "oom" if a hard kill followed.
          note("trigger: app reportMemoryPressure({ level: 'critical' })");
          crashbox.reportMemoryPressure({
            level: "critical",
            source: "app",
            usedBytes: 900 * 1048576,
            limitBytes: 1024 * 1048576,
          });
          setStatus(crashbox.getStatus());
        };
        const jsHeapExhaustion = () => {
          note("trigger: JS heap exhaustion (may hard-kill the tab)");
          // A bare `new ArrayBuffer` only grows VIRTUAL address space — the OS backs it
          // with copy-on-write zero pages, so JSC throws a catchable RangeError before iOS
          // feels real pressure (and the dropped buffer is GC'd). Touching every page forces
          // a PHYSICAL commit (same as the WASM trigger), so resident memory actually climbs
          // until iOS jetsam hard-kills the tab with no error. Yields via setTimeout so the
          // snapshot heartbeat keeps ticking and the kill leaves a recoverable trail.
          const sink = [];
          const STEP = 64 * 1048576; // 64 MB per buffer
          const grow = () => {
            try {
              const buf = new ArrayBuffer(STEP);
              const view = new Uint8Array(buf);
              for (let i = 0; i < view.length; i += 4096) view[i] = 1;
              sink.push(buf);
              setTimeout(grow, 0);
            } catch (e) {
              note(`JS alloc threw (caught, tab survived): ${e.message}`);
            }
          };
          grow();
        };
        // The webgpu detector now wraps the device on attachGPUDevice — it breadcrumbs
        // device.lost / uncapturederror and the oversized-buffer warning automatically, so
        // these handlers just perform the GPU action and let the SDK record it.
        const webgpuDeviceLoss = async () => {
          if (!CAPABILITIES.webgpu) return note("WebGPU unavailable");
          note("trigger: WebGPU graceful device loss (device.destroy)");
          try {
            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            crashbox.attachGPUDevice(device);
            device.destroy(); // detector breadcrumbs device.lost:destroyed (intentional)
          } catch (e) {
            note(`WebGPU error: ${e.message}`);
          }
        };
        const webgpuOversizedBuffer = async () => {
          if (!CAPABILITIES.webgpu) return note("WebGPU unavailable");
          note("trigger: WebGPU oversized buffer");
          try {
            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            crashbox.attachGPUDevice(device);
            // Over maxBufferSize: detector flags it proactively, then the GPUValidationError
            // surfaces via uncapturederror — both recorded by the SDK, no manual note needed.
            device.createBuffer({
              size: device.limits.maxBufferSize * 2,
              usage: GPUBufferUsage.STORAGE,
            });
          } catch (e) {
            note(`WebGPU error: ${e.message}`);
          }
        };
        const webgpuCommitFlood = async () => {
          if (!CAPABILITIES.webgpu) return note("WebGPU unavailable");
          note("trigger: WebGPU commit flood (real VRAM OOM — may hard-kill)");
          try {
            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            crashbox.attachGPUDevice(device);
            // createBuffer is lazy (research §3); only queue.writeBuffer forces a PHYSICAL VRAM
            // commit, which actually OOM-kills the tab — with NO device.lost. The webgpu detector
            // logs throttled GPU activity (committed bytes), so the trail carries a
            // webgpu-device-lost marker even though the kill fires no error — no manual crumbs here.
            const CHUNK = 128 * 1048576; // 128 MB per buffer
            const src = new Uint8Array(CHUNK); // one reused CPU source
            const step = () => {
              try {
                const buf = device.createBuffer({
                  size: CHUNK,
                  usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.STORAGE,
                });
                device.queue.writeBuffer(buf, 0, src);
                setTimeout(step, 0);
              } catch (e) {
                note(
                  `GPU commit flood threw (caught, tab survived): ${e.message}`,
                );
              }
            };
            step();
          } catch (e) {
            note(`WebGPU error: ${e.message}`);
          }
        };

        // Wipe crashbox's localStorage keys via the debug handle (reset between trials), then
        // clear the open dump view and refresh status so the page reflects the empty store.
        const resetCrashbox = () => {
          const removed = window.__crashbox?.clear() ?? [];
          note(`reset crashbox (cleared ${removed.length} storage key(s))`);
          setInlineView(null);
          setStatus(crashbox.getStatus());
        };

        const recovered = recoveredRecord;

        return html`
          <div className="container">
            <div className="header">
              <div className="title-row">
                <h1>crashbox</h1>
                <a
                  className="github-link"
                  href="https://github.com/nearform/crashbox"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="crashbox on GitHub"
                >
                  <i className="ph ph-github-logo"></i>
                </a>
              </div>
              <p>
                Local-first crash black box for the browser. Trigger a crash,
                let the tab die, reload, and confirm the recovered record below.
              </p>
              <p style=${{ fontSize: "0.9em", color: "#718096" }}>
                The red <em>kill</em> triggers only hard-kill memory-limited
                devices (iOS); on desktop, most often tabs survive.
              </p>
            </div>

            ${recovered
              ? html`<div
                  className="demo-section"
                  style=${{ borderLeft: "6px solid #c0392b" }}
                >
                  <h2>⚠️ Recovered crash from the previous session</h2>
                  <p>
                    <strong>reason:</strong> ${recovered.reason} ·
                    <strong>session:</strong> ${recovered.sessionId} ·
                    <strong>time of death:</strong>
                    ${Math.round((Date.now() - recovered.lastSeen) / 1000)}s ago
                    · <strong>corroborated:</strong>
                    ${String(recovered.corroborated)}
                  </p>
                  <strong>snapshot</strong>
                  <pre>${JSON.stringify(recovered.snapshot, null, 2)}</pre>
                  <strong>breadcrumb tail</strong>
                  <pre>
${recovered.breadcrumbs
                      .map(
                        (c) =>
                          `${c.msg}${c.data ? "  " + JSON.stringify(c.data) : ""}`,
                      )
                      .join("\n")}</pre
                  >
                </div>`
              : html`<div className="demo-section">
                  <h2>No crash recovered ✅</h2>
                  <p>
                    Clean load (or a clean reload / iOS discard). Trigger a hard
                    kill below, then reload to see the recovered record here.
                  </p>
                </div>`}

            <div className="demo-section">
              <h2>Live session</h2>
              <p>
                <strong>sessionId:</strong>
                ${" "}${status ? status.sessionId : "—"}<br />
                <strong>snapshot counter:</strong> ${" "}${counter}<br />
                <strong>breadcrumbs:</strong>
                ${" "}${status ? status.breadcrumbCount : 0}<br />
                <strong>JS heap:</strong>
                ${" "}${memMB === null
                  ? "unsupported (iOS Safari)"
                  : memMB + " MB"}
              </p>
              <strong>live session warnings</strong>
              <pre>
${(status?.warnings ?? [])
                  .map((w) => {
                    const when = new Date(w.t).toLocaleTimeString();
                    const lvl = w.info?.level ? ` ${w.info.level}` : "";
                    const src = w.info?.source ? ` (${w.info.source})` : "";
                    return `${when}  ${w.kind}${lvl}${src}`;
                  })
                  .join("\n") || "(no warnings this session)"}</pre
              >
              <strong>capabilities</strong>
              <pre>${JSON.stringify(CAPABILITIES, null, 2)}</pre>
              <strong>recent actions</strong>
              <pre>${pressed.join("\n") || "(press a trigger)"}</pre>
            </div>

            <div className="demo-section">
              <h2>Debug actions</h2>
              <p>
                Reads the live <code>window.__crashbox</code> handle (<code
                  >debug: true</code
                >): <code>dump()</code> parses every
                <code>crashbox:*</code> localStorage key;
                <code>recovered()</code>
                returns this load's recovered record.
              </p>
              <div className="trigger-group">
                <button
                  className="pure-button trigger"
                  onClick=${() =>
                    setInlineView((cur) =>
                      cur?.key === "dump"
                        ? null
                        : {
                            key: "dump",
                            label: "Full dump",
                            payload: window.__crashbox?.dump() ?? null,
                          },
                    )}
                >
                  ${inlineView?.key === "dump" ? "Hide dump" : "Show dump"}
                </button>
                <button
                  className="pure-button trigger"
                  onClick=${() =>
                    setInlineView((cur) =>
                      cur?.key === "recovered"
                        ? null
                        : {
                            key: "recovered",
                            label: "Recovered crash",
                            payload: window.__crashbox?.recovered() ?? null,
                          },
                    )}
                >
                  ${inlineView?.key === "recovered"
                    ? "Hide recovered"
                    : "Show recovered"}
                </button>
                <button
                  className="pure-button trigger"
                  onClick=${resetCrashbox}
                >
                  <i className="ph ph-trash"></i> Reset crashbox
                </button>
              </div>
              ${inlineView !== null &&
              html`<${InlineView} view=${inlineView} />`}
            </div>

            <div className="demo-section">
              <h2>Negative control</h2>
              <div className="trigger-group">
                <${Trigger}
                  label="Clean reload"
                  kind="catchable"
                  onClick=${cleanReload}
                />
              </div>
              <p>Must produce <strong>no</strong> crash record after reload.</p>
            </div>

            <div className="demo-section">
              <h2>WebGPU triggers</h2>
              <p>
                The <code>webgpu</code> detector wraps the device on
                <code>attachGPUDevice</code> and breadcrumbs
                <code>device.lost</code> / <code>uncapturederror</code> /
                oversized buffers automatically. Both below are catchable (tab
                survives); a real GPU OOM hard-kills the tab with no event and
                is caught by inference on the next load.
              </p>
              <div className="trigger-group">
                <${Trigger}
                  label="Graceful device loss (device.destroy)"
                  kind="catchable"
                  onClick=${webgpuDeviceLoss}
                />
                <${Trigger}
                  label="Oversized buffer (> maxBufferSize)"
                  kind="catchable"
                  onClick=${webgpuOversizedBuffer}
                />
                <${Trigger}
                  label="GPU commit flood (writeBuffer until OOM)"
                  kind="kill"
                  onClick=${webgpuCommitFlood}
                />
              </div>
            </div>

            <div className="demo-section">
              <h2>WASM / memory triggers</h2>
              <div className="trigger-group">
                <${Trigger}
                  label="WASM linear-memory blowup → RangeError"
                  kind="kill"
                  onClick=${wasmBlowup}
                />
                <${Trigger}
                  label="JS heap exhaustion"
                  kind="kill"
                  onClick=${jsHeapExhaustion}
                />
                <${Trigger}
                  label="Report memory pressure (app-declared)"
                  kind="catchable"
                  onClick=${reportPressure}
                />
              </div>
            </div>

            <div className="demo-section">
              <h2>General / JS triggers</h2>
              <div className="trigger-group">
                <${Trigger}
                  label="Uncaught exception"
                  kind="catchable"
                  onClick=${uncaughtException}
                />
                <${Trigger}
                  label="Unhandled rejection"
                  kind="catchable"
                  onClick=${unhandledRejection}
                />
                <${Trigger}
                  label="Long task (3s block)"
                  kind="catchable"
                  onClick=${longTask}
                />
              </div>
            </div>
          </div>
        `;
      };

      const root = createRoot(document.getElementById("root"));
      root.render(html`<${App} />`);
    </script>
  </body>
</html>
