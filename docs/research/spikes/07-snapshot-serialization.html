  <body>
    <h1>crashbox spike 07 — snapshot serialization cost & capability</h1>
    <p>
      Runs on load; results in <code>window.__results</code> (read by the CDP
      driver) and below. See
      <a href="../07-snapshot-serialization.md">findings doc</a>.
    </p>
    <pre id="out">running…</pre>

    <script type="module">
      // Build a representative snapshot of approx `targetBytes` JSON size: nested
      // objects + arrays of strings/numbers, the shape a real app state resembles.
      const buildSnapshot = (targetBytes) => {
        const obj = { meta: { ts: Date.now(), v: 1 }, items: [] };
        let bytes = 0;
        let i = 0;
        while (bytes < targetBytes) {
          const entry = {
            id: i,
            label: "item-" + i + "-" + "x".repeat(16),
            value: Math.sin(i) * 1e6,
            tags: ["a", "b", "c", "tag" + (i % 50)],
            nested: { a: i, b: i * 2, c: "n" + i },
          };
          obj.items.push(entry);
          bytes += JSON.stringify(entry).length + 1;
          i++;
        }
        return obj;
      };

      const time = (fn, iters) => {
        // warm up
        for (let k = 0; k < 3; k++) fn();
        const t0 = performance.now();
        for (let k = 0; k < iters; k++) fn();
        return (performance.now() - t0) / iters; // ms per op
      };

      const measureMemory = async () => {
        if (
          !self.crossOriginIsolated ||
          !performance.measureUserAgentSpecificMemory
        )
          return {
            available: false,
            crossOriginIsolated: self.crossOriginIsolated,
          };
        try {
          const r = await Promise.race([
            performance.measureUserAgentSpecificMemory(),
            new Promise((res) =>
              setTimeout(() => res({ timeout: true }), 8000),
            ),
          ]);
          return {
            available: true,
            bytes: r.bytes,
            timeout: r.timeout ?? false,
          };
        } catch (e) {
          return { available: false, error: String(e) };
        }
      };

      const results = {
        ua: navigator.userAgent,
        sizes: [],
        capability: {},
        memory: {},
      };

      const targets = [1024, 10 * 1024, 100 * 1024, 1024 * 1024];
      for (const t of targets) {
        const snap = buildSnapshot(t);
        const json = JSON.stringify(snap);
        const iters = t >= 1024 * 1024 ? 30 : 200;
        const jsonMs = time(() => JSON.stringify(snap), iters);
        const cloneMs = time(() => structuredClone(snap), iters);
        const roundtripMs = time(() => JSON.parse(JSON.stringify(snap)), iters);
        results.sizes.push({
          target_bytes: t,
          json_bytes: json.length,
          items: snap.items.length,
          json_stringify_ms: +jsonMs.toFixed(4),
          structured_clone_ms: +cloneMs.toFixed(4),
          json_roundtrip_ms: +roundtripMs.toFixed(4),
        });
      }

      // Capability matrix: what each path can represent.
      const cap = results.capability;
      // 1. typed arrays
      const ta = { buf: new Uint8Array([1, 2, 3, 255]) };
      cap.structuredClone_typedArray = (() => {
        const c = structuredClone(ta);
        return c.buf instanceof Uint8Array && c.buf[3] === 255
          ? "preserved"
          : "lossy";
      })();
      cap.json_typedArray = (() => {
        const c = JSON.parse(JSON.stringify(ta));
        return Array.isArray(c.buf)
          ? "lossy(object/array)"
          : JSON.stringify(c.buf);
      })();
      // 2. cycles
      const cyc = { name: "root" };
      cyc.self = cyc;
      cap.structuredClone_cycle = (() => {
        try {
          const c = structuredClone(cyc);
          return c.self === c ? "preserved" : "altered";
        } catch (e) {
          return "throws: " + e.name;
        }
      })();
      cap.json_cycle = (() => {
        try {
          JSON.stringify(cyc);
          return "ok";
        } catch (e) {
          return "throws: " + e.name;
        }
      })();
      // 3. functions / undefined / Date / Map
      const rich = {
        fn: () => 1,
        undef: undefined,
        when: new Date(0),
        map: new Map([["k", "v"]]),
      };
      cap.structuredClone_function = (() => {
        try {
          structuredClone(rich);
          return "ok (fn cloned? no—DataCloneError expected)";
        } catch (e) {
          return "throws: " + e.name;
        }
      })();
      cap.json_richTypes = (() => {
        const c = JSON.parse(
          JSON.stringify({
            undef: undefined,
            when: new Date(0),
            map: rich.map,
          }),
        );
        return JSON.stringify(c); // shows Date->string, undefined dropped, Map->{}
      })();

      results.memory = await measureMemory();
      results.performance_memory = !!performance.memory;

      window.__results = results;
      document.getElementById("out").textContent = JSON.stringify(
        results,
        null,
        2,
      );
    </script>
