  <body>
    <h1>crashbox spike — iOS capabilities probe</h1>
    <p>
      Loads instantly. Copy the box below. Probes memory-pressure indicators
      (#6) and the storage budget (#9). See
      <a href="../06-memory-pressure.md">findings doc</a>.
    </p>
    <pre id="out">probing…</pre>

    <script type="module">
      const out = {
        ua: navigator.userAgent,
        // memory-pressure leading indicators (#6):
        "navigator.deviceMemory": navigator.deviceMemory ?? "unsupported",
        "navigator.hardwareConcurrency":
          navigator.hardwareConcurrency ?? "unsupported",
        "performance.memory":
          typeof performance.memory !== "undefined" ? "present" : "unsupported",
        crossOriginIsolated: self.crossOriginIsolated,
        "measureUserAgentSpecificMemory present":
          typeof performance.measureUserAgentSpecificMemory === "function",
        // storage budget (#9):
        storageEstimate: "pending",
        persisted: "pending",
        // lifecycle / detector availability:
        "navigator.gpu (WebGPU)": !!navigator.gpu,
        WebAssembly: typeof WebAssembly !== "undefined",
        "document.wasDiscarded": document.wasDiscarded,
        "PerformanceObserver longtask": (() => {
          try {
            return PerformanceObserver.supportedEntryTypes.includes("longtask");
          } catch {
            return "unknown";
          }
        })(),
        ReportingObserver: typeof ReportingObserver !== "undefined",
      };

      const render = () =>
        (document.getElementById("out").textContent = JSON.stringify(
          out,
          null,
          2,
        ));
      render();

      try {
        if (navigator.storage?.estimate) {
          const est = await navigator.storage.estimate();
          out.storageEstimate = {
            quota_MB: Math.round((est.quota || 0) / 1048576),
            usage_MB: Math.round((est.usage || 0) / 1048576),
          };
        } else {
          out.storageEstimate = "unsupported";
        }
        out.persisted = navigator.storage?.persisted
          ? await navigator.storage.persisted()
          : "unsupported";
      } catch (e) {
        out.storageEstimate = "error: " + e;
      }
      render();
      window.__caps = out;
    </script>
